<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hellcastle Football Darts</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #ef4444;
      --accent-hover: #dc2626;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --gold: #f59e0b;
      --green: #10b981;
      --blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 15px;
    }

    h1 {
      color: var(--accent);
      font-size: 2.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    /* Setup Screen */
    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: var(--bg-color);
      color: var(--text);
      font-size: 1rem;
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--border);
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .btn-action {
      background-color: var(--blue);
    }

    .btn-action:hover {
      background-color: #2563eb;
    }

    .btn-warning {
      background-color: var(--gold);
      color: #000;
    }

    .btn-warning:hover {
      background-color: #d97706;
    }

    /* Scoreboard */
    .scoreboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      text-align: center;
    }

    .player-card {
      padding: 15px;
      border-radius: 8px;
      background: rgba(0,0,0,0.2);
      border: 2px solid transparent;
    }

    .player-card.active {
      border-color: var(--accent);
      background: rgba(239, 68, 68, 0.05);
    }

    .player-name {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .player-score {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--gold);
    }

    .game-status {
      display: flex;
      justify-content: space-between;
      padding: 10px 15px;
      background: var(--bg-color);
      border-radius: 6px;
      margin-top: 15px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* Drive Tracker */
    .field-container {
      overflow-x: auto;
      padding: 10px 0;
    }

    .field {
      display: flex;
      min-width: 600px;
      gap: 4px;
    }

    .segment {
      flex: 1;
      background-color: var(--bg-color);
      border: 1px solid var(--border);
      padding: 10px 4px;
      text-align: center;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    .segment.active-target {
      border-color: var(--accent);
      background-color: rgba(239, 68, 68, 0.2);
      font-weight: bold;
    }

    .segment.cleared {
      background-color: rgba(16, 185, 129, 0.2);
      border-color: var(--green);
      color: var(--green);
    }

    /* Inputs */
    .dart-inputs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .dart-inputs .btn {
      padding: 15px 5px;
      font-size: 0.9rem;
    }

    .turn-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .darts-thrown {
      display: flex;
      gap: 10px;
    }

    .dart-badge {
      background: var(--bg-color);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 4px;
      font-weight: bold;
      min-width: 50px;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .prompt-box {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--gold);
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 15px;
    }

    .prompt-buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .log-container {
      max-height: 150px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85rem;
      background: var(--bg-color);
      padding: 10px;
      border-radius: 6px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Hellcastle Football Darts</h1>
  </header>

  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="card">
    <div class="form-group">
      <label for="p1-name">Player / Team 1 (Home)</label>
      <input type="text" id="p1-name" value="Player 1">
    </div>
    <div class="form-group">
      <label for="p2-name">Player / Team 2 (Away)</label>
      <input type="text" id="p2-name" value="Player 2">
    </div>
    <div class="form-group">
      <label for="board-type">Board Type</label>
      <select id="board-type">
        <option value="quad">Quad Board (All Targets)</option>
        <option value="basic">Basic Board (No Quad/Middle)</option>
      </select>
    </div>
    <button class="btn" id="start-btn">Start Match</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="card hidden">
    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="player-card" id="p1-card">
        <div class="player-name" id="p1-display">Player 1</div>
        <div class="player-score" id="p1-score">0</div>
      </div>
      <div class="player-card" id="p2-card">
        <div class="player-name" id="p2-display">Player 2</div>
        <div class="player-score" id="p2-score">0</div>
      </div>
    </div>

    <div class="game-status">
      <span id="half-indicator">Half 1</span>
      <span id="poss-indicator">Poss 1/4</span>
      <span id="down-indicator">Down 1</span>
    </div>

    <!-- Drive Progression -->
    <div style="margin-top: 15px;">
      <label>Current Drive Target Progression</label>
      <div class="field-container">
        <div class="field" id="field-tracker"></div>
      </div>
    </div>

    <!-- Special Prompts (5th Down / PAT) -->
    <div id="prompt-area" class="prompt-box hidden">
      <div id="prompt-message">5th Down Choice:</div>
      <div class="prompt-buttons">
        <button class="btn btn-warning" id="prompt-opt1">Go For It</button>
        <button class="btn btn-action hidden" id="prompt-opt2">FG Attempt</button>
      </div>
    </div>

    <!-- Inputs & Turn Tracking -->
    <div style="margin-top: 15px;">
      <div class="turn-info">
        <div>Darts Thrown:</div>
        <div class="darts-thrown">
          <div class="dart-badge" id="dart-1">-</div>
          <div class="dart-badge" id="dart-2">-</div>
          <div class="dart-badge" id="dart-3">-</div>
        </div>
      </div>

      <div class="dart-inputs" id="input-buttons">
        <!-- Dynamic Buttons -->
      </div>
    </div>

    <!-- Controls -->
    <div style="margin-top: 15px; display: flex; gap: 10px;">
      <button class="btn btn-secondary" id="undo-btn">Undo</button>
    </div>

    <!-- Play Log -->
    <div style="margin-top: 15px;">
      <label>Game Log</label>
      <div class="log-container" id="game-log"></div>
    </div>
  </div>
</div>

<script>
  // Game State
  const FULL_PROGRESSION = [
    { id: 'p_double', label: 'Your Double', target: 'DOUBLE', side: 'own' },
    { id: 'p_outer', label: 'Your Outer', target: 'OUTER', side: 'own' },
    { id: 'p_triple', label: 'Your Triple', target: 'TRIPLE', side: 'own' },
    { id: 'p_middle', label: 'Your Middle', target: 'MIDDLE', side: 'own' },
    { id: 'p_quad', label: 'Your Quad', target: 'QUAD', side: 'own' },
    { id: 'p_inner', label: 'Your Inner', target: 'INNER', side: 'own' },
    { id: 'bull', label: 'Bull', target: 'BULL', side: 'neutral' },
    { id: 'o_inner', label: 'Opponent Inner', target: 'INNER', side: 'opp' },
    { id: 'o_quad', label: 'Opponent Quad', target: 'QUAD', side: 'opp' },
    { id: 'o_middle', label: 'Opponent Middle', target: 'MIDDLE', side: 'opp' },
    { id: 'o_triple', label: 'Opponent Triple', target: 'TRIPLE', side: 'opp' },
    { id: 'o_outer', label: 'Opponent Outer', target: 'OUTER', side: 'opp' },
    { id: 'o_double', label: 'Opponent Double', target: 'DOUBLE', side: 'opp' }
  ];

  let state = {
    players: [{ name: '', score: 0 }, { name: '', score: 0 }],
    boardType: 'quad',
    progressionSequence: [],
    half: 1,
    possessionCount: 1, // 1 to 4 per half
    activePlayer: 0, // 0 or 1
    down: 1, // 1 to 5
    dartsThisTurn: [],
    targetIndex: 0,
    mode: 'NORMAL', // NORMAL, FIFTH_DOWN_PROMPT, PAT, FG_ATTEMPT
    history: []
  };

  // DOM Elements
  const setupScreen = document.getElementById('setup-screen');
  const gameScreen = document.getElementById('game-screen');
  const startBtn = document.getElementById('start-btn');
  const p1Card = document.getElementById('p1-card');
  const p2Card = document.getElementById('p2-card');
  const fieldTracker = document.getElementById('field-tracker');
  const inputButtons = document.getElementById('input-buttons');
  const promptArea = document.getElementById('prompt-area');
  const promptMsg = document.getElementById('prompt-message');
  const promptOpt1 = document.getElementById('prompt-opt1');
  const promptOpt2 = document.getElementById('prompt-opt2');
  const undoBtn = document.getElementById('undo-btn');
  const gameLog = document.getElementById('game-log');

  startBtn.addEventListener('click', startGame);
  undoBtn.addEventListener('click', handleUndo);

  function saveState() {
    state.history.push(JSON.stringify({
      players: state.players,
      half: state.half,
      possessionCount: state.possessionCount,
      activePlayer: state.activePlayer,
      down: state.down,
      dartsThisTurn: [...state.dartsThisTurn],
      targetIndex: state.targetIndex,
      mode: state.mode,
      log: gameLog.innerHTML
    }));
  }

  function handleUndo() {
    if (state.history.length === 0) return;
    const previous = JSON.parse(state.history.pop());
    state.players = previous.players;
    state.half = previous.half;
    state.possessionCount = previous.possessionCount;
    state.activePlayer = previous.activePlayer;
    state.down = previous.down;
    state.dartsThisTurn = previous.dartsThisTurn;
    state.targetIndex = previous.targetIndex;
    state.mode = previous.mode;
    gameLog.innerHTML = previous.log;
    updateUI();
  }

  function logAction(msg) {
    const entry = document.createElement('div');
    entry.textContent = `[H${state.half} P${state.possessionCount} D${state.down}] ${msg}`;
    gameLog.prepend(entry);
  }

  function startGame() {
    state.players[0].name = document.getElementById('p1-name').value || 'Player 1';
    state.players[1].name = document.getElementById('p2-name').value || 'Player 2';
    state.boardType = document.getElementById('board-type').value;

    // Filter Board Progression
    if (state.boardType === 'basic') {
      state.progressionSequence = FULL_PROGRESSION.filter(
        item => item.target !== 'QUAD' && item.target !== 'MIDDLE'
      );
    } else {
      state.progressionSequence = [...FULL_PROGRESSION];
    }

    document.getElementById('p1-display').textContent = state.players[0].name;
    document.getElementById('p2-display').textContent = state.players[1].name;

    setupScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');

    renderInputButtons();
    updateUI();
  }

  function renderInputButtons() {
    inputButtons.innerHTML = '';
    const targets = ['DOUBLE', 'OUTER', 'TRIPLE', 'MIDDLE', 'QUAD', 'INNER', 'BULL', 'MISS'];
    
    targets.forEach(t => {
      if (state.boardType === 'basic' && (t === 'QUAD' || t === 'MIDDLE')) return;
      
      const btn = document.createElement('button');
      btn.className = 'btn btn-secondary';
      btn.textContent = t;
      btn.onclick = () => handleDartInput(t);
      inputButtons.appendChild(btn);
    });
  }

  function renderPATButtons() {
    inputButtons.innerHTML = '';
    const patTargets = ['S20', 'T20', 'Q20', 'MISS'];
    
    patTargets.forEach(t => {
      if (state.boardType === 'basic' && t === 'Q20') return;
      const btn = document.createElement('button');
      btn.className = 'btn btn-action';
      btn.textContent = t === 'S20' ? 'Single 20' : t === 'T20' ? 'Triple 20' : t === 'Q20' ? 'Quad 20' : 'MISS';
      btn.onclick = () => handlePATInput(t);
      inputButtons.appendChild(btn);
    });
  }

  function renderFGButtons() {
    inputButtons.innerHTML = '';
    const fgTargets = ['ANY 20', 'Q20', 'MISS'];
    
    fgTargets.forEach(t => {
      if (state.boardType === 'basic' && t === 'Q20') return;
      const btn = document.createElement('button');
      btn.className = 'btn btn-warning';
      btn.textContent = t === 'ANY 20' ? 'Any 20 (3pts)' : t === 'Q20' ? 'Quad 20 (4pts)' : 'MISS';
      btn.onclick = () => handleFGInput(t);
      inputButtons.appendChild(btn);
    });
  }

  function updateUI() {
    // Scoreboard
    document.getElementById('p1-score').textContent = state.players[0].score;
    document.getElementById('p2-score').textContent = state.players[1].score;
    p1Card.classList.toggle('active', state.activePlayer === 0);
    p2Card.classList.toggle('active', state.activePlayer === 1);

    // Status
    document.getElementById('half-indicator').textContent = `Half ${state.half}`;
    document.getElementById('poss-indicator').textContent = `Poss ${state.possessionCount}/4`;
    document.getElementById('down-indicator').textContent = `Down ${state.down}`;

    // Darts Thrown Badges
    for (let i = 1; i <= 3; i++) {
      const badge = document.getElementById(`dart-${i}`);
      badge.textContent = state.dartsThisTurn[i - 1] || '-';
    }

    // Field Tracker
    fieldTracker.innerHTML = '';
    state.progressionSequence.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'segment';
      if (index < state.targetIndex) div.classList.add('cleared');
      if (index === state.targetIndex) div.classList.add('active-target');

      div.innerHTML = `<div>${item.label}</div><div style="font-size:0.6rem; margin-top:2px; color:var(--text-muted);">${item.target}</div>`;
      fieldTracker.appendChild(div);
    });

    // Handle Modes & Prompts
    promptArea.classList.add('hidden');
    if (state.mode === 'FIFTH_DOWN_PROMPT') {
      promptArea.classList.remove('hidden');
      promptMsg.textContent = "5th Down! Choose your action:";
      promptOpt1.textContent = "Go For It";
      promptOpt1.onclick = () => {
        saveState();
        state.mode = 'NORMAL';
        renderInputButtons();
        updateUI();
      };

      // Check if eligible for FG (Bull or Opponent Side)
      const currentSeg = state.progressionSequence[state.targetIndex];
      const canAttemptFG = currentSeg.side === 'bull' || currentSeg.side === 'neutral' || currentSeg.side === 'opp';

      if (canAttemptFG) {
        promptOpt2.classList.remove('hidden');
        promptOpt2.textContent = "FG Attempt";
        promptOpt2.onclick = () => {
          saveState();
          state.mode = 'FG_ATTEMPT';
          renderFGButtons();
          updateUI();
        };
      } else {
        promptOpt2.classList.add('hidden');
      }
    } else if (state.mode === 'NORMAL') {
      renderInputButtons();
    }
  }

  function handleDartInput(hitType) {
    saveState();
    state.dartsThisTurn.push(hitType);
    
    const activeTarget = state.progressionSequence[state.targetIndex].target;

    if (hitType === activeTarget) {
      state.targetIndex++;
      logAction(`${state.players[state.activePlayer].name} HIT ${hitType}! Advanced to target ${state.targetIndex + 1}`);
      
      // Touchdown check
      if (state.targetIndex >= state.progressionSequence.length) {
        state.players[state.activePlayer].score += 6;
        logAction(`TOUCHDOWN ${state.players[state.activePlayer].name}! (+6 pts)`);
        state.mode = 'PAT';
        state.dartsThisTurn = [];
        renderPATButtons();
        updateUI();
        return;
      }
    } else {
      logAction(`${state.players[state.activePlayer].name} hit ${hitType} (Needed ${activeTarget})`);
    }

    checkTurnProgress();
  }

  function handlePATInput(hit) {
    saveState();
    let pts = 0;
    if (hit === 'S20') pts = 1;
    if (hit === 'T20') pts = 2;
    if (hit === 'Q20') pts = 3;

    state.players[state.activePlayer].score += pts;
    logAction(`Extra Point Attempt: ${hit} (${pts} pts)`);

    // Reset drive to starting position after a score
    endPossession(true);
  }

  function handleFGInput(hit) {
    saveState();
    let isScore = false;
    let pts = 0;
    if (hit === 'ANY 20') pts = 3;
    if (hit === 'Q20') pts = 4;

    if (pts > 0) {
      isScore = true;
      state.players[state.activePlayer].score += pts;
      logAction(`FIELD GOAL GOOD! ${hit} (+${pts} pts)`);
    } else {
      logAction(`FIELD GOAL MISSED!`);
    }

    // Pass isScore boolean so next possession starts at Double if hit
    endPossession(isScore);
  }

  function checkTurnProgress() {
    if (state.dartsThisTurn.length >= 3) {
      // Round Complete
      state.dartsThisTurn = [];
      state.down++;

      if (state.down === 5 && state.mode === 'NORMAL') {
        state.mode = 'FIFTH_DOWN_PROMPT';
      } else if (state.down > 5) {
        // Turnover on Downs
        logAction(`Turnover on Downs by ${state.players[state.activePlayer].name}!`);
        endPossession(false);
        return;
      }
    }
    updateUI();
  }

  function endPossession(wasScore) {
    state.dartsThisTurn = [];
    state.down = 1;
    state.mode = 'NORMAL';

    if (wasScore) {
      // Start fresh from starting double after any successful score (TD or FG)
      state.targetIndex = 0;
    } else {
      // Turn over at stopped segment (Invert field relative to new player)
      state.targetIndex = (state.progressionSequence.length - 1) - state.targetIndex;
    }

    // Switch Player
    state.activePlayer = state.activePlayer === 0 ? 1 : 0;
    state.possessionCount++;

    if (state.possessionCount > 4) {
      state.possessionCount = 1;
      state.half++;
    }

    if (state.half > 2) {
      alert(`Game Over! Final Score:\n${state.players[0].name}: ${state.players[0].score}\n${state.players[1].name}: ${state.players[1].score}`);
      logAction(`GAME OVER!`);
    } else {
      logAction(`New Possession: ${state.players[state.activePlayer].name}`);
    }

    renderInputButtons();
    updateUI();
  }
</script>
</body>
</html>
