<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Football Darts</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel2: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --line: #334155;
      --chip: #374151;
      --good: #16a34a;
      --bad: #dc2626;
      --info: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #0b1220 0%, var(--bg) 100%);
      color: var(--text);
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }
    h1, h2, h3 { margin: 0 0 12px; }
    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 16px;
    }
    .card {
      background: rgba(17,24,39,.9);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .field {
      flex: 1 1 180px;
      min-width: 150px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input, select, button, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #475569;
      background: #0b1220;
      color: var(--text);
      border-radius: 10px;
      font-size: 14px;
    }
    button {
      cursor: pointer;
      background: #1d4ed8;
      border: none;
      font-weight: 700;
    }
    button.secondary { background: #334155; }
    button.good { background: var(--good); }
    button.warn { background: var(--warn); color: #111827; }
    button.bad { background: var(--bad); }
    button.info { background: var(--info); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .scoreboard {
      display: grid;
      grid-template-columns: 1fr 110px 1fr;
      gap: 12px;
      align-items: stretch;
    }
    .teamBox {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: rgba(15,23,42,.65);
    }
    .teamName { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .score { font-size: 42px; font-weight: 900; line-height: 1; }
    .small { color: var(--muted); font-size: 12px; }
    .centerBox {
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: rgba(15,23,42,.65);
    }
    .pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--chip);
      margin: 2px 4px 2px 0;
      font-size: 12px;
    }
    .route {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .seg {
      padding: 8px 10px;
      border-radius: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      min-width: 52px;
      text-align: center;
      font-weight: 700;
    }
    .done { background: #14532d; border-color: #166534; }
    .current { background: #92400e; border-color: #b45309; }
    .log {
      max-height: 320px;
      overflow: auto;
      background: #0b1220;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.45;
    }
    .logItem { padding: 8px 0; border-bottom: 1px solid #1f2937; }
    .logItem:last-child { border-bottom: 0; }
    .muted { color: var(--muted); }
    .divider { height: 1px; background: var(--line); margin: 12px 0; }
    .hidden { display: none; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; }
    .toolbar > * { flex: 1 1 180px; }
    .darts-counter {
      font-size: 12px;
      color: var(--warn);
      margin-top: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Football Darts Scoreboard</h1>

    <div class="card" id="setupCard">
      <h2>Setup</h2>
      <div class="row">
        <div class="field"><label>Left Team Name</label><input id="leftTeam" value="Left Team"></div>
        <div class="field"><label>Right Team Name</label><input id="rightTeam" value="Right Team"></div>
        <div class="field"><label>Left Players (comma separated)</label><input id="leftPlayers" value="Player 1, Player 2"></div>
        <div class="field"><label>Right Players (comma separated)</label><input id="rightPlayers" value="Player 3, Player 4"></div>
      </div>

      <div class="row" style="margin-top:12px;">
        <div class="field"><label>Quarter Length (minutes)</label><input id="quarterLen" type="number" value="5" min="1"></div>
        <div class="field"><label>Total Game Length (minutes)</label><input id="gameLen" type="number" value="20" min="1"></div>
        <div class="field">
          <label>2-Point Conversion</label>
          <select id="twoPointMode">
            <option value="off">Off</option>
            <option value="triple20">Must hit Triple 20</option>
          </select>
        </div>
        <div class="field">
          <label>Bull Progression</label>
          <select id="bullMode">
            <option value="standard">Outer Bull -> Bullseye -> Outer Bull</option>
            <option value="simple">Any bull counts as one step</option>
          </select>
        </div>
      </div>

      <div class="toolbar" style="margin-top:12px;">
        <button class="good" id="startBtn">Start Game</button>
        <button class="secondary" id="resetBtn">Reset</button>
      </div>
    </div>

    <div class="grid hidden" id="gameUI" style="margin-top:16px;">
      <div class="card">
        <h2>Scoreboard</h2>
        <div class="scoreboard">
          <div class="teamBox">
            <div class="teamName" id="leftName"></div>
            <div class="score" id="leftScore">0</div>
            <div class="small" id="leftMeta"></div>
          </div>
          <div class="centerBox">
            <div><span class="pill" id="quarterPill">Q1</span></div>
            <div><strong id="clock">05:00</strong></div>
            <div class="small" id="downInfo">1st down</div>
            <div class="small" id="possessionInfo">Possession: Left Team</div>
            <div class="small" id="targetInfo">Target: 14</div>
            <div class="small" id="dartsInfo">Darts: 0/3</div>
            <div class="small" id="statusInfo">Ready</div>
          </div>
          <div class="teamBox">
            <div class="teamName" id="rightName"></div>
            <div class="score" id="rightScore">0</div>
            <div class="small" id="rightMeta"></div>
          </div>
        </div>

        <div class="divider"></div>

        <h3>Segment Track</h3>
        <div class="row">
          <div class="field">
            <div class="small" id="leftRouteLabel"></div>
            <div class="route" id="leftRoute"></div>
          </div>
          <div class="field">
            <div class="small" id="rightRouteLabel"></div>
            <div class="route" id="rightRoute"></div>
          </div>
        </div>

        <div class="divider"></div>

        <h3>Throw Input</h3>
        <div class="row">
          <div class="field">
            <label>Player</label>
            <select id="playerSelect"></select>
          </div>
          <div class="field">
            <label>Hit Type</label>
            <select id="hitType">
              <option value="single">Single</option>
              <option value="double">Double</option>
              <option value="triple">Triple</option>
              <option value="bull">Bullseye</option>
              <option value="outerbull">Outer Bull</option>
              <option value="miss">Miss</option>
            </select>
          </div>
          <div class="field">
            <label>Segment Number</label>
            <select id="segmentNum"></select>
          </div>
          <div class="field">
            <label>Action</label>
            <button id="submitThrow">Record Throw</button>
          </div>
        </div>

        <div class="toolbar" style="margin-top:12px;">
          <button class="info" id="pauseBtn">Pause Timer</button>
          <button class="secondary" id="manualEndDownBtn">End Down (Auto)</button>
          <button class="warn" id="fieldGoalBtn">Kick FG</button>
          <button class="warn" id="puntBtn">PUNT</button>
          <button class="warn" id="tdBtn">Touchdown</button>
          <button class="secondary" id="undoBtn">Undo</button>
        </div>
      </div>

      <div class="card">
        <h2>Game Log</h2>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>

<script>
const leftRouteBase = [14, 11, 8, "B", 8, 11, 14];
const rightRouteBase = [13, 6, 10, "B", 10, 6, 13];
let game = null;
let timerInterval = null;

function clone(x){ return JSON.parse(JSON.stringify(x)); }
function fmtTime(sec){ const m = Math.floor(sec/60), s = sec%60; return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }

function makeTeam(name, players, route){
  return {
    name,
    players,
    score: 0,
    route,
    idx: 0,
    down: 1,
    dartsThrown: 0, // Tracks throws per down
    possession: false,
    touchdownPending: false,
    twoPointPending: false,
    fgEligible: false,
    lastReached: route,
    completed: []
  };
}

function initGame(){
  const leftName = document.getElementById("leftTeam").value.trim();
  const rightName = document.getElementById("rightTeam").value.trim();
  const leftPlayers = document.getElementById("leftPlayers").value.split(",").map(s=>s.trim()).filter(Boolean);
  const rightPlayers = document.getElementById("rightPlayers").value.split(",").map(s=>s.trim()).filter(Boolean);
  const qLen = parseInt(document.getElementById("quarterLen").value,10) || 5;
  const gLen = parseInt(document.getElementById("gameLen").value,10) || 20;

  game = {
    quarterLen: qLen * 60,
    totalLen: gLen * 60,
    clock: qLen * 60,
    quarter: 1,
    running: false,
    over: false,
    left: makeTeam(leftName, leftPlayers, clone(leftRouteBase)),
    right: makeTeam(rightName, rightPlayers, clone(rightRouteBase)),
    possessionSide: "left",
    log: [],
    history: [],
    twoPointMode: document.getElementById("twoPointMode").value,
    bullMode: document.getElementById("bullMode").value
  };
  game.left.possession = true;
  renderAll();
  log(`Game ready. ${leftName} vs ${rightName}. Closest bullseye decides first.`);
}

function currentTeam(){ return game[game.possessionSide]; }
function otherTeam(){ return game[game.possessionSide === "left" ? "right" : "left"]; }

function routeLabel(seg){ return seg === "B" ? "Bull" : seg; }

function renderRoute(teamKey, elId){
  const team = game[teamKey];
  const el = document.getElementById(elId);
  el.innerHTML = "";
  team.route.forEach((seg, i) => {
    const d = document.createElement("div");
    d.className = "seg" + (i < team.idx ? " done" : "") + (i === team.idx ? " current" : "");
    d.textContent = routeLabel(seg);
    el.appendChild(d);
  });
}

function renderPlayers(){
  const sel = document.getElementById("playerSelect");
  sel.innerHTML = "";
  [game.left, game.right].forEach(team => {
    team.players.forEach(p => {
      const o = document.createElement("option");
      o.value = `${team.name}::${p
